<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>What's Your Lucky Capsule?</title>
  <meta name="description" content="A digital gashapon game. Press one button and discover a surprise capsule.">
  <meta name="theme-color" content="#7ed6ff">
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <button id="sound" class="sound" type="button" aria-pressed="false" aria-label="Sound effects off. Press to turn on">
    <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9z" fill="currentColor"/><path class="waves" d="M15 9a4 4 0 0 1 0 6M17.5 6.5a8 8 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path class="slash" d="M16 9l5 6M21 9l-5 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  </button>

  <header class="brand">
    <div class="logos">
      <img src="assets/logos/dost.png" alt="DOST logo" width="256" height="256">
      <img src="assets/logos/neust-ads.png" alt="NEUST Association of DOST Scholars logo" width="256" height="256">
      <img src="assets/logos/dost-sei.png" alt="DOST-SEI logo" width="256" height="256">
    </div>
  </header>

  <main class="app">
    <h1>What's Your Lucky Capsule?</h1>
    <p class="intro" id="intro">One button. One surprise. No pressure, no quiz, just fun. Press the button and see what drops!</p>

    <div class="machine" id="machine">
      <svg viewBox="0 0 280 400" class="machine-svg" aria-hidden="true" focusable="false">
        <defs><clipPath id="domeClip"><circle cx="140" cy="118" r="98"/></clipPath></defs>
        <ellipse cx="140" cy="388" rx="112" ry="9" fill="#7a5af8" opacity=".25"/>
        <rect x="34" y="190" width="212" height="170" rx="30" fill="#7a5af8" stroke="#1f1747" stroke-width="4"/>
        <rect x="46" y="204" width="188" height="10" rx="5" fill="#fff" opacity=".25"/>
        <rect x="24" y="184" width="232" height="26" rx="13" fill="#f783b6" stroke="#1f1747" stroke-width="4"/>
        <circle cx="140" cy="118" r="100" fill="#cff0ff" fill-opacity=".6" stroke="#1f1747" stroke-width="4"/>
        <g clip-path="url(#domeClip)"><g id="domeCaps"></g></g>
        <path d="M70 80a80 80 0 0 1 40-46" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" opacity=".8"/>
        <rect x="100" y="8" width="80" height="22" rx="11" fill="#ffd27f" stroke="#1f1747" stroke-width="4"/>
        <rect x="112" y="222" width="56" height="96" rx="28" fill="#1f1747" opacity=".28"/>
        <g id="knob">
          <circle cx="88" cy="262" r="30" fill="#ffd27f" stroke="#1f1747" stroke-width="4"/>
          <rect x="62" y="257" width="52" height="10" rx="5" fill="#7a5af8" stroke="#1f1747" stroke-width="3"/>
        </g>
        <rect x="176" y="236" width="52" height="52" rx="12" fill="#cff0ff" stroke="#1f1747" stroke-width="4"/>
        <polygon points="202,245 206.2,256.3 218.2,256.8 208.7,264.1 212,275.7 202,269 192,275.7 195.3,264.1 185.8,256.8 197.8,256.3" fill="#ffd27f" stroke="#1f1747" stroke-width="2.5" stroke-linejoin="round"/>
        <rect x="62" y="312" width="156" height="58" rx="20" fill="#7ed6ff" stroke="#1f1747" stroke-width="4"/>
        <rect x="74" y="320" width="132" height="36" rx="14" fill="#1f1747" opacity=".35"/>
      </svg>
      <div class="burst" id="burst"></div>
      <div class="cap" id="cap" hidden><i class="top"></i><i class="bot"></i></div>
      <div class="fx-layer" id="fx"></div>
    </div>

    <button id="draw" class="btn" type="button">DRAW YOUR CAPSULE!</button>

    <section id="result" class="card" hidden aria-labelledby="cname">
      <div class="illus" id="illus"></div>
      <p class="badge" id="badge"></p>
      <p class="cat" id="cat"></p>
      <h2 id="cname"></h2>
      <p class="msg" id="cmsg"></p>
      <button id="share" class="btn ghost" type="button">Share Result</button>
      <p class="note" id="shareMsg" role="status" aria-live="polite"></p>
    </section>
    <p class="sr" id="live" role="status" aria-live="polite"></p>
  </main>

  <footer class="foot">
    <img src="assets/logos/start.png" alt="START logo" width="181" height="256">
    <p>© START-DOST 2026. All rights reserved.</p>
  </footer>

  <script type="module" src="js/main.js"></script>
</body>
</html>
